security:
    # Hachage automatique des mots de passe (bcrypt / argon2 selon la machine)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # L'adresse e-mail est l'identifiant de connexion
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|uploads)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            # Redirige vers /login (avec un message en rouge) lors d'un accès non autorisé
            entry_point: App\Security\LoginRedirectEntryPoint
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: _username
                password_parameter: _password
                default_target_path: app_figurine_index
            logout:
                path: app_logout
                target: app_home

    # Seuls les utilisateurs connectés peuvent voir, créer, éditer ou supprimer des figurines
    access_control:
        - { path: ^/figurine, roles: ROLE_USER }
        - { path: ^/account, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
